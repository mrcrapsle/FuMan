# This workflow builds the standalone game file, runs the Playwright regression
# suite against it and - auf main - veroeffentlicht das Ergebnis per GitHub Pages.

name: Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Build standalone game
        run: python3 build.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lint dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: tests
        run: npm test

      - name: Build minified variant
        run: npm run minify

      - name: Run tests against minified build
        working-directory: tests
        run: npm test
        env:
          GAME_FILE: anstoss-fm13-standalone.min.html

  # Veroeffentlicht das Spiel unter https://mrcrapsle.github.io/FuMan/.
  # Bewusst mit "needs: test": so steht nie ein Build oeffentlich, dessen Testsuite auf
  # demselben Commit rot war. Laeuft nur auf main, nicht auf Pull Requests.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Build standalone game
        run: python3 build.py

      - name: Assemble site
        # Die gebaute Standalone-Datei wird zur Startseite: eine einzige Datei ohne
        # relative Abhaengigkeiten - damit kann beim Ausliefern nichts fehlen.
        run: |
          mkdir -p site
          cp dist/anstoss-fm13-standalone.html site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
