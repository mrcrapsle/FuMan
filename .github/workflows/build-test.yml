# This workflow builds the standalone game file, runs the Playwright regression
# suite against it and - auf main - veroeffentlicht das Ergebnis per GitHub Pages.

name: Build & Test

on:
  # Auch Feature-Branches testen, damit Fehler VOR dem Merge auffallen; veröffentlicht
  # wird weiterhin nur von main (siehe deploy-Job).
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Build standalone game
        run: python3 build.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lint dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: tests
        env:
          TEST_JOBS: "3"
        run: npm test

      - name: Build minified variant
        run: npm run minify

      - name: Run tests against minified build
        working-directory: tests
        env:
          TEST_JOBS: "3"
          # Entwickler-Fassung minifiziert; die öffentliche (Download-Link) prüft testOeffentlicheFassung
          GAME_FILE: anstoss-fm13-dev.min.html
        run: npm test

  # Veroeffentlicht das Spiel unter https://mrcrapsle.github.io/FuMan/.
  # Bewusst mit "needs: test": so steht nie ein Build oeffentlich, dessen Testsuite auf
  # demselben Commit rot war. Laeuft nur auf main, nicht auf Pull Requests.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Build standalone game
        run: python3 build.py

      - name: Assemble site
        # Startseite ist die oeffentliche Fassung OHNE Admin-Menue (eine einzige Datei ohne relative
        # Abhaengigkeiten). Die Entwickler-Fassung MIT Admin-Menue kommt nur unter den geheimen Pfad aus
        # dem Repository-Secret DEV_PFAD und fragt nach der PIN aus dem Secret DEV_PIN (build.py --nur-dev).
        # Ohne DEV_PFAD wird nur die oeffentliche Seite veroeffentlicht. Secrets erscheinen im Log als ***.
        env:
          DEV_PFAD: ${{ secrets.DEV_PFAD }}
          DEV_PIN: ${{ secrets.DEV_PIN }}
        run: |
          mkdir -p site
          cp dist/anstoss-fm13-oeffentlich.html site/index.html
          # Kleine Versionsdatei fuer den Hinweis "Neue Version verfuegbar" (js/neue-version.js)
          VERSION=$(grep -oP "GAME_VERSION = \{ number: '\K[0-9.]+" js/state.js)
          printf '{"version":"%s"}\n' "$VERSION" > site/version.json
          if [ -z "$DEV_PFAD" ]; then
            echo "::notice title=Entwickler-Seite::Secret DEV_PFAD fehlt - nur die oeffentliche Seite wird veroeffentlicht."
          elif ! printf '%s' "$DEV_PFAD" | grep -Eq '^[A-Za-z0-9-]{8,64}$'; then
            echo "::warning title=Entwickler-Seite::DEV_PFAD braucht 8 bis 64 Zeichen aus Buchstaben, Ziffern und Bindestrich - uebersprungen."
          else
            [ -n "$DEV_PIN" ] || echo "::warning title=Entwickler-Seite::Secret DEV_PIN fehlt - das Admin-Menue ist dort ohne PIN offen."
            mkdir -p "site/$DEV_PFAD"
            DEV_AUSGABE="site/$DEV_PFAD/index.html" python3 build.py --nur-dev
            cp site/version.json "site/$DEV_PFAD/version.json"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
