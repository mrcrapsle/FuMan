# This workflow builds the standalone game file and runs the Playwright
# regression suite against it.

name: Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Build standalone game
        run: python3 build.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lint dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: tests
        run: npm test

      - name: Build minified variant
        run: npm run minify

      - name: Run tests against minified build
        working-directory: tests
        run: npm test
        env:
          GAME_FILE: anstoss-fm13-standalone.min.html
