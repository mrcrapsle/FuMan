<title>Runenfeuer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-bleed isometric world canvas. Resource bar on top, five-tab war-council bar at the bottom,
   panels rise as bottom sheets over the village. Battle swaps the chrome for life/mana bars, stick and rune buttons. */
:root{
  --night:#0f120e;
  --stone:#1a1f18;
  --slate:#262e23;
  --line:#3a4434;
  --parch:#eee2c6;
  --dim:#a8a088;
  --ember:#ec7b3d;
  --arcane:#a688ff;
  --moss:#8cb84c;
  --blood:#e04d3e;
  --gold:#ecc65e;
  --frost:#80cbe9;
  --shade:rgba(8,10,7,.72);
  --display:"Grenze Gotisch","Iowan Old Style",Georgia,serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --navh:62px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--parch);font:15px/1.4 var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}

/* top bar */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 22px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:7px;background:linear-gradient(to bottom,var(--night) 40%,transparent);pointer-events:none}
.idrow{display:flex;align-items:center;gap:10px}
.lvl{flex:none;width:40px;height:44px;display:grid;place-items:center;font-family:var(--display);font-size:21px;font-weight:800;color:var(--night);background:var(--gold);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.idtext{min-width:0;flex:1}
.clan{font-family:var(--display);font-size:22px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.xp{height:5px;border-radius:3px;background:var(--slate);overflow:hidden;margin-top:4px;max-width:260px}
.xp b{display:block;height:100%;background:var(--gold);width:0}
#mute{pointer-events:auto;flex:none;background:var(--stone);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--dim)}
.res{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;background:var(--stone);border:1px solid var(--line);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.chip small{font-weight:500;color:var(--dim);font-size:11px}
.gem{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;flex:none}
.g-gold{background:var(--gold)}.g-frost{background:var(--frost)}.g-moss{background:var(--moss)}.g-ember{background:var(--ember)}.g-arcane{background:var(--arcane)}

/* bottom bar */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));background:var(--stone);border-top:1px solid var(--line)}
#nav button{position:relative;background:none;border:0;border-radius:10px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.03em}
#nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-pressed="true"]{background:var(--slate);color:var(--parch)}
#nav button[aria-pressed="true"] svg{stroke:var(--ember)}
#nav .dot{position:absolute;top:3px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--ember)}

/* sheets */
#sheet{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));z-index:7;max-height:min(66vh,calc(100% - 170px));overflow:auto;background:var(--stone);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:0 max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));box-shadow:0 -14px 40px rgba(0,0,0,.55);overscroll-behavior:contain;touch-action:pan-y}
.sh-head{position:sticky;top:0;z-index:2;background:var(--stone);display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.sh-head .tt{flex:1;min-width:0}
.sh-head h2{font-size:28px;line-height:1}
.x{flex:none;background:var(--slate);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;font-size:18px;line-height:1}
.sub{color:var(--dim);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;padding:11px 12px;background:var(--slate);border-radius:12px;border:1px solid var(--line)}
.row.focus{border-color:var(--gold)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:800;font-size:15px}
.row .d{font-size:13px;color:var(--dim)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.btn{flex:none;border:0;border-radius:10px;padding:9px 14px;font-weight:800;background:var(--ember);color:var(--night);font-size:14px;white-space:nowrap}
.btn.alt{background:var(--arcane)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--parch)}
.btn:disabled{background:var(--line);color:var(--dim);cursor:not-allowed}
.btn.big{width:100%;padding:14px;font-size:19px;font-family:var(--display);letter-spacing:.03em}
.cost{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:3px}
.no{color:var(--blood)}
.pips{display:inline-flex;gap:4px;vertical-align:middle;margin-left:8px}
.pips i{width:7px;height:7px;transform:rotate(45deg);background:var(--line)}
.pips i.on{background:var(--gold)}
.sec{font-family:var(--display);font-size:21px;margin:18px 0 8px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;vertical-align:1px}
.t-easy{background:color-mix(in srgb,var(--moss) 22%,transparent);color:var(--moss)}
.t-fair{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.t-hard{background:color-mix(in srgb,var(--ember) 22%,transparent);color:var(--ember)}
.t-dead{background:color-mix(in srgb,var(--blood) 25%,transparent);color:var(--blood)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--slate);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.tree{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:620px){.tree{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
.branch{display:flex;flex-direction:column;gap:6px}
.branch h3{font-size:18px;color:var(--gold)}
.sk{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--slate);border:1px solid var(--line);border-radius:10px}
.sk .main{flex:1;min-width:0}
.sk .t{font-weight:800;font-size:14px}
.sk .d{font-size:12px;color:var(--dim)}
.plus{flex:none;width:32px;height:32px;border-radius:8px;border:0;background:var(--gold);color:var(--night);font-weight:800;font-size:18px}
.plus:disabled{background:var(--line);color:var(--dim)}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.slot{background:var(--slate);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.slot span{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.slot b{font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fchip{border:1px solid var(--line);background:var(--slate);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.fchip[aria-pressed="true"]{background:var(--parch);color:var(--night);border-color:var(--parch)}
ol.rankl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;counter-reset:r}
ol.rankl li{counter-increment:r;display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;background:var(--slate);font-variant-numeric:tabular-nums}
ol.rankl li::before{content:counter(r);font-family:var(--display);font-size:18px;width:20px;color:var(--dim)}
ol.rankl li.me{outline:1px solid var(--gold)}
ol.rankl li .n{flex:1;min-width:0;font-weight:700}

/* battle hud */
#bhud{position:fixed;inset:0;z-index:4;pointer-events:none}
#bhud .top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:flex-start}
.bars{flex:1;max-width:300px;display:flex;flex-direction:column;gap:5px}
.bar{height:15px;border-radius:8px;background:var(--stone);border:1px solid var(--line);overflow:hidden;position:relative}
.bar b{position:absolute;left:0;top:0;bottom:0;width:100%}
.bar.hp b{background:var(--blood)}
.bar.mp b{background:var(--arcane)}
.bar.sh b{background:var(--parch);opacity:.55}
.bar span{position:absolute;inset:0;font-size:10px;font-weight:800;line-height:13px;padding-left:7px;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.binfo{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#btitle{font-family:var(--display);font-size:18px;line-height:1.05;max-width:46vw}
#bstat{font-size:12px;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
#retreat{pointer-events:auto;background:var(--stone);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800}
#joyzone{position:absolute;left:0;bottom:0;width:58%;top:20%;pointer-events:auto;touch-action:none}
#joyb{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(238,226,198,.35);background:rgba(15,18,14,.35)}
#joyk{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(238,226,198,.65)}
.joyhint{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--dim);font-weight:700}
#abil{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:200px;height:200px}
.ab{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid var(--line);background:var(--stone);display:grid;place-items:center;font-size:11px;font-weight:800;text-align:center;line-height:1.05;padding:5px;touch-action:none;overflow:hidden}
.ab::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.72) calc(var(--cd,0) * 1turn),transparent 0)}
.ab .k{display:none;font-size:9px;color:var(--dim)}
@media (hover:hover){.ab .k{display:block}}
.ab.main{width:88px;height:88px;right:0;bottom:0;background:var(--ember);border-color:var(--ember);color:var(--night);font-size:15px;font-family:var(--display)}
.ab.main .k{color:var(--night)}
.ab.s1{width:62px;height:62px;right:98px;bottom:2px}
.ab.s2{width:62px;height:62px;right:82px;bottom:80px}
.ab.s3{width:62px;height:62px;right:4px;bottom:100px}
.ab.locked{opacity:.45}
.ab.nomp{color:var(--arcane)}
#banner{position:absolute;top:28%;left:0;right:0;text-align:center;font-family:var(--display);font-size:46px;text-shadow:0 3px 0 rgba(0,0,0,.65);opacity:0;transition:opacity .35s}

/* toast + modal */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 108px);transform:translateX(-50%);z-index:40;background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;width:max-content;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--shade)}
#modal .card{width:100%;max-width:460px;max-height:100%;overflow:auto;background:var(--stone);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:800}
.logo{font-size:58px;line-height:.9;color:var(--parch)}
.logo em{font-style:normal;color:var(--ember)}
.classes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cls{text-align:left;background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.cls b{font-family:var(--display);font-size:21px;font-weight:700}
.cls span{font-size:12.5px;color:var(--dim);line-height:1.3}
.cls[aria-pressed="true"]{border-color:var(--ember);box-shadow:inset 0 0 0 1px var(--ember)}
.cls[data-arg="magier"][aria-pressed="true"]{border-color:var(--arcane);box-shadow:inset 0 0 0 1px var(--arcane)}
label.lbl{font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.inp{width:100%;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--parch);font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swb{width:36px;height:36px;border-radius:10px;border:2px solid var(--line)}
.swb[aria-pressed="true"]{border-color:var(--parch);box-shadow:0 0 0 2px var(--night) inset}
.res-lines{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.res-lines div{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;background:var(--slate);border-radius:8px}
.res-lines .pos{color:var(--moss);font-weight:800}
.res-lines .neg{color:var(--blood);font-weight:800}
.big-h{font-size:46px;line-height:.95}
.win{color:var(--gold)}.lose{color:var(--blood)}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}
@media (prefers-reduced-motion:reduce){#banner,#toast{transition:none}}
</style>

<canvas id="world" aria-label="Spielwelt"></canvas>

<header id="hud" hidden>
  <div class="idrow">
    <div class="lvl" id="hLvl" title="Heldenstufe">1</div>
    <div class="idtext">
      <div class="clan" id="hClan">Clan</div>
      <div class="rank" id="hRank">Haufen</div>
      <div class="xp"><b id="hXp"></b></div>
    </div>
    <button id="mute" type="button">Ton an</button>
  </div>
  <div class="res">
    <span class="chip"><i class="gem g-gold"></i><span id="rGold">0</span><small>Gold</small></span>
    <span class="chip"><i class="gem g-frost"></i><span id="rCry">0</span><small>Kristalle</small></span>
    <span class="chip"><i class="gem g-moss"></i><span id="rMem">0</span><small>Krieger</small></span>
    <span class="chip"><i class="gem g-ember"></i><span id="rRuhm">0</span><small>Ruhm</small></span>

</header>

<nav id="nav" hidden>
  <button type="button" data-tab="burg" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 21V9l3 2V6l3 2V4l3 2 3-2v4l3-2v5l3-2v12z"/><path d="M10 21v-5h4v5"/></svg>Burg<i class="dot" id="dBurg" hidden></i></button>
  <button type="button" data-tab="tag" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Tag<i class="dot" id="dTag" hidden></i></button>
  <button type="button" data-tab="held" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 11a7 7 0 0 1 14 0v3H5z"/><path d="M5 14l2 6h10l2-6M9 11h6M3 9l2 2M21 9l-2 2"/></svg>Held<i class="dot" id="dHeld" hidden></i></button>
  <button type="button" data-tab="krieg" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 20L18 6M14 4l6 6-3 1-4-4zM20 20L6 6M10 4L4 10l3 1 4-4z"/></svg>Krieg</button>
  <button type="button" data-tab="markt" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9h16l-1.5 11h-13z"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/></svg>Markt</button>
</nav>

<section id="sheet" hidden></section>

<div id="bhud" hidden>
  <div class="top">
    <div class="bars">
      <div class="bar hp"><b id="bHp"></b><span id="bHpT">LP</span></div>
      <div class="bar mp"><b id="bMp"></b><span id="bMpT">Mana</span></div>
    </div>
    <div class="binfo">
      <div id="btitle">Kampf</div>
      <div id="bstat">Welle 1</div>
      <button id="retreat" type="button">Rückzug</button>
    </div>
  </div>
  <div id="joyzone"><div id="joyb" hidden><div id="joyk"></div></div></div>

  <div id="abil">
    <button class="ab main" type="button" data-ab="0"><span><span class="nm">Hieb</span><span class="k">Leertaste</span></span></button>
    <button class="ab s1" type="button" data-ab="1"><span><span class="nm">—</span><span class="k">K</span></span></button>
    <button class="ab s2" type="button" data-ab="2"><span><span class="nm">—</span><span class="k">L</span></span></button>
    <button class="ab s3" type="button" data-ab="3"><span><span class="nm">—</span><span class="k">I</span></span></button>
  </div>
  <div id="banner"></div>
</div>

<div id="toast" role="status"></div>
<div id="modal" hidden></div>

<script>
'use strict';
/* ================= basics ================= */
const $=id=>document.getElementById(id);
const cv=$('world'),ctx=cv.getContext('2d');
let W=1,H=1,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=Math.max(1,cv.clientWidth);H=Math.max(1,cv.clientHeight);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);}
addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rand(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>Math.floor(n).toLocaleString('de-DE');
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function hash(x,y){let h=(x|0)*374761393+(y|0)*668265263;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const shadeCache={};
function shade(hex,f){const key=hex+f;if(shadeCache[key])return shadeCache[key];let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;if(f<0){r*=1+f;g*=1+f;b*=1+f}else{r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}return shadeCache[key]=`rgb(${r|0},${g|0},${b|0})`;}

/* ================= data ================= */
const CLASSES={
  ork:{name:'Orkhäuptling',hp:150,mp:50,atk:15,def:4,spd:3.3,body:'ork',crew:['grunt','speer'],crewNames:'Ork-Krieger und Speerwerfer',clan:'Clan der Grauhauer',
       desc:'Nahkampf mit der Axt, Ansturm und Kriegsschrei. Viel Leben, führt eine Horde Ork-Krieger.'},
  magier:{name:'Erzmagier',hp:100,mp:110,atk:13,def:2,spd:3.4,body:'mage',crew:['lehrling','golem'],crewNames:'Lehrlinge und Steingolems',clan:'Orden des Blauen Feuers',
       desc:'Feuerbälle aus der Distanz, Blinzeln und Arkanschild. Führt Lehrlinge und Steingolems.'}

let AC=null,muted=true,lastSfx={};
function unlockAudio(){if(AC||muted)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
function tone(f,d,type,v,slide){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,v,fq){if(!AC||muted)return;const t=AC.currentTime,len=Math.max(1,Math.floor(AC.sampleRate*d)),buf=AC.createBuffer(1,len,AC.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=buf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fq;const g=AC.createGain();g.gain.value=v;s.connect(f).connect(g).connect(AC.destination);s.start(t);}
const SFX={hit:()=>noise(.08,.22,1400),swing:()=>noise(.1,.07,3000),fire:()=>{noise(.22,.1,900);tone(240,.2,'sawtooth',.03,.5)},boom:()=>{noise(.5,.32,300);tone(90,.5,'sine',.28,.4)},roar:()=>{tone(140,.5,'sawtooth',.1,.6);noise(.4,.08,600)},frost:()=>{tone(1200,.4,'triangle',.07,.4);noise(.3,.08,4000)},blink:()=>tone(600,.18,'sine',.09,2.2),shield:()=>tone(400,.4,'triangle',.09,1.6),coin:()=>{tone(988,.08,'square',.04);setTimeout(()=>tone(1319,.12,'square',.04),70)},level:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.09),i*110)),whoosh:()=>noise(.2,.1,1800),build:()=>{noise(.12,.15,700);setTimeout(()=>noise(.12,.15,700),140)}};

  for(const a of ACTIONS){const c=a.cost(),ok=a.ok();const dis=S.actions<1||ok!==true||!canPay(c);
    h+=`<div class="row"><div class="main"><div class="t">${a.name}</div><div class="d">${a.d()}</div><div class="cost">${ok===true?costHTML(c):`<span class="no">${ok}</span>`}</div></div><button class="btn" type="button" data-act="do" data-arg="${a.id}" ${dis?'disabled':''}>Los</button></div>`;}
  h+=`</div><div class="sec">Tag beenden</div><p class="sub" style="margin-bottom:10px">Über Nacht: +${fmt(g)} Gold aus der Mine${k?`, +${k} Kristalle`:''}, −${fmt(up)} Gold Verpflegung für ${S.members} Krieger.</p><button class="btn big" type="button" data-act="endday">Tag beenden</button>`;
  return h;
}
function shHeld(){
  const hs=heroStats(),h=S.hero,c=CLASSES[S.cls],ab=ABIL[S.cls];
  let s=head(`${c.name} · Stufe ${h.lvl}`,`${fmt(h.xp)} / ${fmt(xpNeed(h.lvl))} Erfahrung · ${h.sp} Fähigkeitspunkt${h.sp===1?'':'e'}`);
  s+=`<div class="stats"><div class="stat"><b>${hs.hp}</b><span>Leben</span></div><div class="stat"><b>${hs.mp}</b><span>Mana</span></div><div class="stat"><b>${Math.round(hs.atk)}</b><span>Angriff</span></div><div class="stat"><b>${Math.round(hs.def)}</b><span>Rüstung</span></div></div>`;
  s+=`<div class="sec">Ausrüstung</div><div class="slots">`;for(const k in SLOTS){const it=itemById(h.gear[k]);s+=`<div class="slot"><span>${SLOTS[k]}</span><b>${it?esc(it.name):'—'}</b></div>`}s+=`</div>`;
  s+=`<div class="sec">Clan-Krieger</div><div class="row"><div class="main"><div class="t">${crewSize()} ziehen mit in den Kampf</div><div class="d">${c.crewNames}${S.b.kaserne>=2?'':' (zweite Truppe ab Kaserne 2)'} · Trainingsstufe ${S.crewLvl} · Stärke ×${crewMult().toFixed(2)}</div></div></div>`;
  s+=`<div class="sec">Fähigkeiten</div><div class="tree">`;
  for(const br of ['Kraft','Arkan','Führung']){s+=`<div class="branch"><h3>${br}</h3>`;
    for(const id in SKILLS){const d=SKILLS[id];if(d.br!==br)continue;const r=sk(id);
      const name=id==='ult'?ab[3].name.replace('­',''):d.name,desc=id==='ult'?(S.cls==='ork'?'Schlägt auf den Boden, betäubt alle Feinde in der Nähe':'Eisring, der Feinde verlangsamt und Schaden macht')+` · ab Stufe ${d.req}`:d.desc;
      const can=h.sp>0&&r<3&&(!d.req||h.lvl>=d.req);
      s+=`<div class="sk"><div class="main"><div class="t">${name}${pips(r,3)}</div><div class="d">${desc}</div></div><button class="plus" type="button" data-act="skill" data-arg="${id}" ${can?'':'disabled'} aria-label="${name} lernen">+</button></div>`;}
    s+='</div>';}
  s+='</div>';return s;
}
function shKrieg(){
  let h=head('Krieg',`${S.actions} Aktion${S.actions===1?'':'en'} übrig · Siege bringen Ruhm, Gold und Erfahrung`);
  h+='<div class="sec" style="margin-top:4px">Rivalisierende Clans</div><div class="list">';
  S.rivals.forEach((r,i)=>{const cfg=raidCfg(i);h+=`<div class="row"><div class="main"><div class="t"><span class="sw" style="background:${r.color}"></span>${esc(r.name)}</div><div class="d">${r.faction==='ork'?'Orks':'Magier'} · Stufe ${r.lvl} · ${fmt(r.ruhm)} Ruhm${r.beaten?` · ${r.beaten}× besiegt`:''}</div><div class="cost">${diffTag(cfg)} Beute etwa ${fmt(cfg.reward.g)} Gold, ${cfg.reward.ruhm} Ruhm</div></div><button class="btn" type="button" data-act="raid" data-arg="${i}" ${S.actions<1?'disabled':''}>Angreifen</button></div>`;});

function shMarkt(){

  for(const k in SLOTS)h+=`<button class="fchip" type="button" data-act="slot" data-arg="${k}" aria-pressed="${marketSlot===k}">${SLOTS[k]}</button>`;
  h+='</div><div class="list">';
  for(const it of ITEMS.filter(i=>i.slot===marketSlot&&(!i.cls||i.cls===S.cls))){
    const eq=S.hero.gear[it.slot]===it.id,lock=it.t>S.b.schmiede,c={g:it.g,k:it.k||0};
    const st=[it.atk&&`+${it.atk} Angriff`,it.def&&`+${it.def} Rüstung`,it.hp&&`+${it.hp} Leben`,it.mp&&`+${it.mp} Mana`].filter(Boolean).join(' · ');

/* ---- actions ---- */
function upgrade(k){const l=S.b[k],c=BUILD[k].cost(l);if(!canPay(c))return;pay(c);S.b[k]++;if(k==='halle')S.actions++;sfx('build');toast(`${BUILD[k].name} ist jetzt Stufe ${S.b[k]}`);burstHub(k);refresh();}
function doAction(id){
  const a=ACTIONS.find(x=>x.id===id);const c=a.cost();if(S.actions<1||a.ok()!==true||!canPay(c))return;pay(c);S.actions--;
  if(id==='werben'){let n=1+(sk('werber')>=2?1:0)+(Math.random()<.35?1:0);n=Math.min(n,memberCap(S.b.halle)-S.members);S.members+=n;toast(`${n} neue${n>1?'':'r'} Krieger schließ${n>1?'en':'t'} sich an`);initWalkers();}
  if(id==='training'){S.crewLvl++;gainXP(10);toast(`Krieger trainiert: Stufe ${S.crewLvl}`);}
  if(id==='handel'){const g=Math.round(rand(70,140)*(1+.3*(S.b.halle-1))*goldMult());S.gold+=g;sfx('coin');toast(`Handelszug zurück: +${fmt(g)} Gold`);}
  if(id==='kristall'){const k=ri(5,11)+S.b.kristall*2;S.crystals+=k;toast(`+${k} Kristalle gefunden`);}
  if(id==='fest'){const r=12+S.b.halle*3;S.ruhm+=r;let t=`Fest gefeiert: +${r} Ruhm`;if(Math.random()<.4&&S.members<memberCap(S.b.halle)){S.members++;t+=', ein neuer Krieger';initWalkers();}toast(t);}
  refresh();
}
function learn(id){const h=S.hero,d=SKILLS[id];if(h.sp<1||sk(id)>=3||(d.req&&h.lvl<d.req))return;h.skills[id]=sk(id)+1;h.sp--;sfx('level');refresh();}
function buy(id){const it=itemById(id),c={g:it.g,k:it.k||0};if(!canPay(c)||it.t>S.b.schmiede)return;pay(c);S.hero.gear[it.slot]=id;sfx('coin');toast(`${it.name} angelegt`);refresh();}
function useAction(){if(S.actions<1){toast('Keine Aktion mehr übrig, beende den Tag');return false}S.actions--;return true;}

function endDay(){
  const g=Math.round(45*S.b.mine*goldMult()),k=6*S.b.kristall,up=S.members*3;
  S.gold=Math.max(0,S.gold+g-up);S.crystals+=k;S.day++;S.actions=actionsPerDay();
  for(const r of S.rivals){r.ruhm+=Math.round(rand(2,9)*r.lvl/2);}
  if(S.day%7===0)for(const r of S.rivals)if(r.lvl<S.hero.lvl+4)r.lvl++;
  const lines=[`<div><span>Goldmine</span><span class="pos">+${fmt(g)} Gold</span></div>`];
  if(k)lines.push(`<div><span>Kristallturm</span><span class="pos">+${k} Kristalle</span></div>`);
  lines.push(`<div><span>Verpflegung</span><span class="neg">−${fmt(up)} Gold</span></div>`);
  let ev='',extra='';
  if(S.day>=S.nextRaid){
    S.nextRaid=S.day+ri(6,9);
    const cands=S.rivals.map((r,i)=>i).filter(i=>S.rivals[i].lvl<=S.hero.lvl+2);const i=cands.length?pick(cands):0;
    const r=S.rivals[i],trib=Math.round(S.gold*.3);
    save();renderHud();
    showModal(`<div class="eyebrow">Tag ${S.day} · Alarm</div><h2 class="big-h lose">Angriff!</h2><p>Der Clan <b>${esc(r.name)}</b> (Stufe ${r.lvl}) rückt auf deine Burg vor.</p><div class="res-lines">${lines.join('')}</div><div class="btnrow"><button class="btn" type="button" data-act="defend" data-arg="${i}">Verteidigen</button><button class="btn ghost" type="button" data-act="tribute" data-arg="${trib}">Tribut: ${fmt(trib)} Gold</button></div>`);
    refresh();return;
  }
  const roll=Math.random();
  if(roll<.12){const x=ri(60,140)+S.day*5;S.gold+=x;ev=`Eine Goldader in der Mine: +${fmt(x)} Gold.`;}
  else if(roll<.24&&S.members<memberCap(S.b.halle)){S.members++;initWalkers();ev='Ein Wanderkrieger hört von deinem Ruhm und schließt sich an.';}
  else if(roll<.34){const x=ri(6,14);S.crystals+=x;ev=`Ein Kristallsturm zieht über die Burg: +${x} Kristalle.`;}
  else if(roll<.46){const pool=ITEMS.filter(i=>(!i.cls||i.cls===S.cls)&&i.t<=Math.min(5,S.b.schmiede+1)&&S.hero.gear[i.slot]!==i.id);if(pool.length){const it=pick(pool),price=Math.round(it.g*.7);ev=`Ein wandernder Händler bietet <b>${esc(it.name)}</b> für ${fmt(price)} Gold${it.k?` und ${it.k} Kristalle`:''} an, auch über deiner Schmiedestufe.`;extra=`<button class="btn alt" type="button" data-act="offer" data-arg="${it.id}|${price}" ${canPay({g:price,k:it.k||0})?'':'disabled'}>Kaufen</button>`;}}
  else if(roll<.52&&S.gold>100){const x=Math.round(S.gold*.08);S.gold-=x;ev=`Ein Unwetter beschädigt die Vorräte: −${fmt(x)} Gold.`;}
  save();renderHud();
  showModal(`<div class="eyebrow">Ein neuer Morgen</div><h2 class="big-h">Tag ${S.day}</h2><div class="res-lines">${lines.join('')}</div>${ev?`<p>${ev}</p>`:''}<div class="btnrow">${extra}<button class="btn" type="button" data-act="mclose">Weiter</button></div>`);
  refresh();
}

function closeModal(){$('modal').hidden=true;$('modal').innerHTML='';}

/* ---- central click dispatcher ---- */
function act(a,arg){
  unlockAudio();
  switch(a){
    case 'close':closeSheet();break;
    case 'up':upgrade(arg);break;
    case 'do':doAction(arg);break;
    case 'endday':closeSheet();endDay();break;
    case 'skill':learn(arg);break;
    case 'buy':buy(arg);break;
    case 'slot':marketSlot=arg;renderSheet();break;
    case 'raid':if(useAction()){closeSheet();startBattle(raidCfg(+arg));}break;
    case 'wild':if(useAction()){closeSheet();startBattle(wildCfg(arg));}break;
    case 'mclose':closeModal();break;
    case 'offer':{const [id,p]=arg.split('|');const it=itemById(id),c={g:+p,k:it.k||0};if(canPay(c)){pay(c);S.hero.gear[it.slot]=id;sfx('coin');toast(`${it.name} angelegt`);refresh();}closeModal();break;}
    case 'defend':closeModal();startBattle(defenseCfg(+arg));break;
    case 'tribute':S.gold-=+arg;closeModal();toast('Tribut gezahlt, die Angreifer ziehen ab');refresh();break;
    case 'pickcls':{startSel.cls=arg;if(!startSel.edited)startSel.name=CLASSES[arg].clan;S=newState(arg,startSel.name,startSel.col);initWalkers();showStart();break;}
    case 'pickcol':startSel.col=arg;S.color=arg;showStart();break;
    case 'found':{const nm=($('clanName').value||'').trim()||CLASSES[startSel.cls].clan;S=newState(startSel.cls,nm,startSel.col);DEMO=false;save();closeModal();enterGame();toast('Willkommen, Anführer! Tippe auf Gebäude oder öffne „Tag“.');break;}
    case 'continue':{const s=load();if(s){S=s;DEMO=false;closeModal();enterGame();}break;}
    case 'tohub':closeModal();checkLegend();break;
  }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act,b.dataset.arg);});
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{unlockAudio();if(tab===b.dataset.tab)closeSheet();else openSheet(b.dataset.tab);}));
function enterGame(){$('hud').hidden=false;$('nav').hidden=false;initWalkers();renderHud();}
function checkLegend(){if(!S.legend&&S.ruhm>=3000&&S.rivals.every(r=>r.ruhm<S.ruhm)){S.legend=true;save();showModal(`<div class="eyebrow">Die Lieder werden von euch singen</div><h2 class="big-h win">Legende!</h2><p>${esc(S.name)} ist der ruhmreichste Clan des Landes. Das Spiel geht weiter, die Rivalen werden stärker.</p><button class="btn big" type="button" data-act="mclose">Weiter herrschen</button>`);sfx('level');}}

/* ================= iso drawing helpers ================= */
const cam={ox:0,oy:0,Z:1};
function P(x,y,z){return[cam.ox+(x-y)*32*cam.Z,cam.oy+(x+y)*16*cam.Z-(z||0)*cam.Z];}
function poly(pts,fill){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
function tile(x,y,c){poly([P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)],c);}
function isoBox(x0,y0,x1,y1,z0,h,col){const zt=z0+h;
  poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,zt),P(x0,y1,zt)],shade(col,-.22));
  poly([P(x1,y0,z0),P(x1,y1,z0),P(x1,y1,zt),P(x1,y0,zt)],shade(col,-.42));
  poly([P(x0,y0,zt),P(x1,y0,zt),P(x1,y1,zt),P(x0,y1,zt)],shade(col,.06));}
function gable(x0,y0,x1,y1,z,rh,col){const ym=(y0+y1)/2,zt=z+rh;
  poly([P(x0,y0,z),P(x1,y0,z),P(x1,ym,zt),P(x0,ym,zt)],shade(col,.05));
  poly([P(x0,y1,z),P(x1,y1,z),P(x1,ym,zt),P(x0,ym,zt)],shade(col,-.2));
  poly([P(x1,y0,z),P(x1,y1,z),P(x1,ym,zt)],shade(col,-.45));}
function pyramid(x0,y0,x1,y1,z,rh,col){const a=P((x0+x1)/2,(y0+y1)/2,z+rh);
  poly([P(x0,y0,z),P(x1,y0,z),a],shade(col,.05));poly([P(x0,y0,z),P(x0,y1,z),a],shade(col,0));
  poly([P(x0,y1,z),P(x1,y1,z),a],shade(col,-.22));poly([P(x1,y0,z),P(x1,y1,z),a],shade(col,-.45));}
function circ(x,y,r,c){ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,6.2832);ctx.fillStyle=c;ctx.fill();}
function rr(x,y,w,h,r,c){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fillStyle=c;ctx.fill();}
function glow(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,Math.max(1,r));g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a==null?1:a;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalAlpha=1;}

/* ---- figures ---- */
function armAngle(u,idle){if(u.atkAnim>0){const p=1-u.atkAnim/u.atkDur;return -2.5+p*3.4;}return idle;}
function drawBanner(s,col,t){ctx.strokeStyle='#4a3420';ctx.lineWidth=2*s;ctx.beginPath();ctx.moveTo(-9*s,-8*s);ctx.lineTo(-9*s,-62*s);ctx.stroke();
  const w=Math.sin(t*5)*2*s;ctx.beginPath();ctx.moveTo(-9*s,-62*s);ctx.quadraticCurveTo(-18*s,-58*s+w,-26*s,-60*s+w);ctx.lineTo(-24*s,-50*s+w);ctx.quadraticCurveTo(-17*s,-48*s-w,-9*s,-48*s);ctx.closePath();ctx.fillStyle=col;ctx.fill();}
function drawOrk(u,s,fl,t){
  const skin=fl?'#fff':(u.skin||'#6f9a3c'),tun=fl?'#fff':(u.k==='troll'?'#5a4126':u.color),mv=u.moving?Math.sin(u.walk):0,dk=fl?'#fff':'#33251a';
  ctx.fillStyle=dk;ctx.fillRect((-7+mv*3)*s,-13*s,5*s,13*s);ctx.fillRect((2-mv*3)*s,-13*s,5*s,13*s);
  circ(-9*s,-26*s,4.6*s,skin);
  rr(-10*s,-31*s,20*s,20*s,5*s,tun);
  ctx.fillStyle=fl?'#fff':'#2a1c11';ctx.fillRect(-10*s,-16*s,20*s,3*s);
  if(u.isHero||u.champ){ctx.fillStyle=fl?'#fff':'#bfb7a6';ctx.beginPath();ctx.moveTo(-11*s,-30*s);ctx.lineTo(-4*s,-35*s);ctx.lineTo(-2*s,-29*s);ctx.closePath();ctx.fill();}
  circ(1*s,-36*s,8*s,skin);
  rr(-4*s,-34*s,12*s,7*s,3*s,fl?'#fff':shade(u.skin||'#6f9a3c',-.25));
  ctx.fillStyle='#f4ecd8';ctx.beginPath();ctx.moveTo(-1*s,-32*s);ctx.lineTo(0,-37*s);ctx.lineTo(1.5*s,-32*s);ctx.fill();ctx.beginPath();ctx.moveTo(4.5*s,-32*s);ctx.lineTo(5.5*s,-37*s);ctx.lineTo(7*s,-32*s);ctx.fill();
  circ(3*s,-38.5*s,1.4*s,'#ff5a3c');circ(6.5*s,-38.5*s,1.4*s,'#ff5a3c');
  if(u.isHero){ctx.fillStyle='#1d1612';ctx.beginPath();ctx.moveTo(-3*s,-43*s);ctx.quadraticCurveTo(-12*s,-44*s,-13*s,-34*s);ctx.lineTo(-9*s,-35*s);ctx.quadraticCurveTo(-8*s,-41*s,-1*s,-42*s);ctx.fill();}
  ctx.save();ctx.translate(8*s,-26*s);ctx.rotate(armAngle(u,-.35+mv*.12));
  if(u.wpn==='speer'){ctx.fillStyle='#6b4a2b';ctx.fillRect(-1*s,-32*s,2.2*s,40*s);ctx.fillStyle='#cfc8b8';ctx.beginPath();ctx.moveTo(-2.5*s,-32*s);ctx.lineTo(.1*s,-40*s);ctx.lineTo(2.7*s,-32*s);ctx.fill();}

      p.dead=true;break;}}}
  B.proj=B.proj.filter(p=>!p.dead);
  for(const p of B.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=p.grav*260*dt;if(p.z<0){p.z=0;p.vz*=-.3;p.vx*=.6;p.vy*=.6;}}
  B.parts=B.parts.filter(p=>p.life>0);if(B.parts.length>500)B.parts.splice(0,B.parts.length-500);
  for(const r of B.rings)r.t+=dt;B.rings=B.rings.filter(r=>r.t<r.dur);
  for(const f of B.floats){f.t+=dt;f.z+=40*dt;}B.floats=B.floats.filter(f=>f.t<f.max);
  B.units=B.units.filter(u=>!u.dead||u.deadT<2.6||u.isHero);
  const alive=B.units.filter(u=>u.team===1&&!u.dead).length;
  if(!B.over){
    if(B.hero.dead){B.over=true;B.endT=1.6;B.win=false;banner('Gefallen …');}
    else if(alive===0&&B.wave>=B.cfg.waves.length-1){B.over=true;B.endT=1.4;B.win=true;banner('Sieg!');sfx('level');}
    else if(B.wave<B.cfg.waves.length-1&&alive<=B.waveThresh&&!B.nextWaveT){B.nextWaveT=1.6;banner(`Welle ${B.wave+2} von ${B.cfg.waves.length}`);}
    if(B.nextWaveT){B.nextWaveT-=dt;if(B.nextWaveT<=0){B.nextWaveT=0;B.wave++;spawnWave(B.wave);}}
  }else{B.endT-=dt;if(B.endT<=0&&!B.ended){B.ended=true;endBattle(B.win,false);return;}}
  B.shake=Math.max(0,B.shake-dt*1.6);
  const h=B.hero,hx=(h.x-h.y)*32,hy=(h.x+h.y)*16,k=Math.min(1,dt*6);B.cam.x+=(hx-B.cam.x)*k;B.cam.y+=(hy-B.cam.y)*k;
  // hud
  $('bHp').style.width=(100*h.hp/h.maxhp)+'%';$('bHpT').textContent=`Leben ${Math.ceil(h.hp)} / ${h.maxhp}${h.shield>0?' · Schild '+Math.ceil(h.shield):''}`;
  $('bMp').style.width=(100*h.mp/h.maxmp)+'%';$('bMpT').textContent=`Mana ${Math.floor(h.mp)} / ${h.maxmp}`;
  $('bstat').textContent=`Welle ${B.wave+1}/${B.cfg.waves.length} · ${alive} Feinde · ${B.units.filter(u=>u.team===0&&!u.dead&&!u.isHero).length} Krieger`;
  document.querySelectorAll('.ab').forEach((b,i)=>{const a=B.abil[i],cd=a.cd*(i>0?B.hs.cdr:1);b.style.setProperty('--cd',(B.cds[i]/cd).toFixed(3));b.classList.toggle('nomp',h.mp<a.mp);});
}
function drawObst(o,t){const s=o.s;if(o.k==='tree')tree(o.x,o.y,s,t);else if(o.k==='rock')rock(o.x,o.y,s);else if(o.k==='pillar')pillar(o.x,o.y,s);
  else if(o.k==='hut'){isoBox(o.x-.55,o.y-.5,o.x+.55,o.y+.5,0,16,'#6e5a3e');pyramid(o.x-.65,o.y-.6,o.x+.65,o.y+.6,16,20,'#8e6e38');}}
function drawProj(p){const [x,y]=P(p.x,p.y,p.z),Z=cam.Z;
  ctx.fillStyle='rgba(0,0,0,.25)';const [gx,gy]=P(p.x,p.y,0);ctx.beginPath();ctx.ellipse(gx,gy,4*Z,2*Z,0,0,6.28);ctx.fill();
  if(p.type==='fire'){ctx.globalCompositeOperation='lighter';glow(x,y,18*Z,'rgba(255,154,74,.9)');ctx.globalCompositeOperation='source-over';circ(x,y,4.5*Z,'#fff1c4');}
  else if(p.type==='bolt'){const c=p.team===0?'rgba(255,179,92,.9)':'rgba(166,136,255,.9)';ctx.globalCompositeOperation='lighter';glow(x,y,12*Z,c);ctx.globalCompositeOperation='source-over';circ(x,y,3*Z,'#fff');}
  else{const [x2,y2]=P(p.x-p.vx*.05,p.y-p.vy*.05,p.z);ctx.strokeStyle='#6b4a2b';ctx.lineWidth=2.2*Z;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();circ(x,y,2*Z,'#d2cbbb');}}
function renderBattle(){
  const Z=cam.Z=clamp(Math.min(W,H)/520,.72,1.45),th=THEMES[B.cfg.map],t=B.t;
  const sh=B.shake*10*Z;const shx=(Math.random()-.5)*sh,shy=(Math.random()-.5)*sh;
  cam.ox=W/2-B.cam.x*Z+shx;cam.oy=H/2-B.cam.y*Z+shy+40*Z;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=th.void;ctx.fillRect(0,0,W,H);
  const N=B.N;
  for(let y=-6;y<N+6;y++)for(let x=-6;x<N+6;x++){const [px,py]=P(x+.5,y+.5);if(px<-50||px>W+50||py<-30||py>H+30)continue;
    const inside=x>=0&&y>=0&&x<N&&y<N;tile(x,y,inside?B.tiles[y*N+x]:th.out[(hash(x,y)*th.out.length)|0]);
    if(inside&&hash(x*3,y*5)>.82){const [gx,gy]=P(x+hash(x,y*2),y+hash(x*2,y));ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1.2*Z;ctx.beginPath();ctx.moveTo(gx-3*Z,gy);ctx.lineTo(gx-1*Z,gy-6*Z);ctx.moveTo(gx+1*Z,gy);ctx.lineTo(gx+3*Z,gy-5*Z);ctx.stroke();}}
  for(const r of B.rings){const p=r.t/r.dur,R=r.r0+(r.r1-r.r0)*Math.sqrt(p);const [cx,cy]=P(r.x,r.y);ctx.strokeStyle=r.c;ctx.globalAlpha=1-p;ctx.lineWidth=3*Z;ctx.beginPath();ctx.ellipse(cx,cy,R*45*Z,R*22.6*Z,0,0,6.28);ctx.stroke();ctx.globalAlpha=1;}
  const list=[];for(const o of B.obst)list.push({d:o.x+o.y,f:()=>drawObst(o,t)});
  for(const u of B.units)list.push({d:u.x+u.y-(u.dead?.6:0),f:()=>{const [sx,sy]=P(u.x,u.y);drawFigure(u,sx,sy,t)}});
  for(const p of B.proj)list.push({d:p.x+p.y,f:()=>drawProj(p)});
  list.sort((a,b)=>a.d-b.d);for(const o of list)o.f();
  ctx.globalCompositeOperation='lighter';
  for(const p of B.parts){if(!p.gl)continue;const [px,py]=P(p.x,p.y,p.z);const a=p.life/p.max;glow(px,py,p.sz*3.2*Z,p.c,a);}
  ctx.globalCompositeOperation='source-over';
  for(const p of B.parts){if(p.gl)continue;const [px,py]=P(p.x,p.y,p.z);ctx.globalAlpha=Math.min(1,p.life/p.max*1.5);circ(px,py,p.sz*Z,p.c);}
  ctx.globalAlpha=1;ctx.textAlign='center';
  for(const f of B.floats){const [px,py]=P(f.x,f.y,f.z);const a=1-f.t/f.max,fs=Math.round((f.big?18:13)*Z);ctx.font=`800 ${fs}px Alegreya Sans, sans-serif`;ctx.globalAlpha=Math.min(1,a*2);ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(f.txt,px,py);ctx.fillStyle=f.c;ctx.fillText(f.txt,px,py);}
  ctx.globalAlpha=1;
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,B.hero.hp/B.hero.maxhp<.3?'rgba(120,10,0,.55)':'rgba(0,0,0,.5)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function endBattle(win,retreat){
  const c=B.cfg;let lostMembers=0;for(let i=0;i<B.crewLost;i++)if(Math.random()<.5)lostMembers++;lostMembers=Math.min(lostMembers,Math.max(0,S.members-1));S.members-=lostMembers;
  const lines=[];let xp=0;
  if(win){const r=c.reward;S.gold+=r.g;S.crystals+=r.k||0;S.ruhm+=r.ruhm||0;xp=r.xp;S.wins++;
    lines.push(`<div><span>Beute</span><span class="pos">+${fmt(r.g)} Gold</span></div>`);if(r.k)lines.push(`<div><span>Kristalle</span><span class="pos">+${r.k}</span></div>`);
    lines.push(`<div><span>Ruhm</span><span class="pos">+${r.ruhm}</span></div>`);
    if(c.type==='raid'){const rv=S.rivals[c.rivalIdx];rv.ruhm=Math.max(0,rv.ruhm-Math.round(r.ruhm*.6));rv.beaten++;}}
  else{xp=retreat?0:Math.round((c.reward.xp||0)*.25);S.losses++;
    if(c.type==='defense'){const loss=Math.round(S.gold*.3),rl=10*c.lvl;S.gold-=loss;S.ruhm=Math.max(0,S.ruhm-rl);lines.push(`<div><span>Geplündert</span><span class="neg">−${fmt(loss)} Gold</span></div>`,`<div><span>Ruhm</span><span class="neg">−${rl}</span></div>`);}
    else if(!retreat){const rl=5*c.lvl;S.ruhm=Math.max(0,S.ruhm-rl);lines.push(`<div><span>Ruhm</span><span class="neg">−${rl}</span></div>`);}}
  if(xp)lines.push(`<div><span>Erfahrung</span><span class="pos">+${xp}</span></div>`);
  lines.push(`<div><span>Besiegte Feinde</span><span>${B.kills}</span></div>`);
  if(B.crewLost)lines.push(`<div><span>Verwundete Krieger</span><span>${B.crewLost}${lostMembers?`, davon ${lostMembers} verlassen den Clan`:', alle erholen sich'}</span></div>`);
  const ups=gainXP(xp);
  scene='hub';B=null;$('bhud').hidden=true;$('hud').hidden=false;$('nav').hidden=false;joyVec.x=joyVec.y=0;$('joyb').hidden=true;
  initWalkers();save();renderHud();if(ups)sfx('level');
  const hd=win?'<h2 class="big-h win">Sieg!</h2>':retreat?'<h2 class="big-h">Rückzug</h2>':'<h2 class="big-h lose">Niederlage</h2>';
  showModal(`<div class="eyebrow">${esc(c.title)}</div>${hd}${ups?`<p><b>Stufe ${S.hero.lvl} erreicht!</b> Du hast ${S.hero.sp} Fähigkeitspunkt${S.hero.sp===1?'':'e'}, öffne „Held“.</p>`:''}<div class="res-lines">${lines.join('')}</div><button class="btn big" type="button" data-act="tohub">Zur Burg</button>`);
}

/* battle input */
const jz=$('joyzone'),jb=$('joyb'),jk=$('joyk');let joy=null;
jz.addEventListener('pointerdown',e=>{unlockAudio();joy={id:e.pointerId,x:e.clientX,y:e.clientY};try{jz.setPointerCapture(e.pointerId)}catch(_){}jb.hidden=false;jb.style.left=e.clientX+'px';jb.style.top=(e.clientY-jz.getBoundingClientRect().top)+'px';jk.style.transform='';$('joyhint').hidden=true;e.preventDefault();});
jz.addEventListener('pointermove',e=>{if(!joy||e.pointerId!==joy.id)return;let dx=e.clientX-joy.x,dy=e.clientY-joy.y;const L=Math.hypot(dx,dy),M=50;if(L>M){dx*=M/L;dy*=M/L}jk.style.transform=`translate(${dx}px,${dy}px)`;joyVec.x=dx/M;joyVec.y=dy/M;});
const joyEnd=e=>{if(!joy||e.pointerId!==joy.id)return;joy=null;joyVec.x=joyVec.y=0;jb.hidden=true;};
jz.addEventListener('pointerup',joyEnd);jz.addEventListener('pointercancel',joyEnd);
document.querySelectorAll('.ab').forEach(b=>{const i=+b.dataset.ab;
  b.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();if(!B)return;if(i===0){B.atkHeld=true;}useAbility(i);});
  const up=()=>{if(B&&i===0)B.atkHeld=false;};b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);});
$('retreat').onclick=()=>{if(!B||B.over)return;if(!retreatArm){retreatArm=1;$('retreat').textContent='Wirklich zurückziehen?';setTimeout(()=>{retreatArm=0;if(B)$('retreat').textContent='Rückzug';},2500);return;}B.over=true;B.ended=true;endBattle(false,true);};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(scene!=='battle')return;
  const map={k:1,l:2,i:3,'1':0,'2':1,'3':2,'4':3};if(map[k]!==undefined)useAbility(map[k]);if(k===' '||k.startsWith('arrow'))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

/* ================= loop & boot ================= */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  try{if(scene==='battle'&&B){updateBattle(dt);if(B)renderBattle();}else if(S){updateHub(dt);renderHub();}}catch(err){console.error(err);}
  requestAnimationFrame(frame);}
function boot(data){
  if(data&&data.S){S=data.S;DEMO=false;enterGame();}
  else{S=newState('ork',CLASSES.ork.clan,COLORS[0]);DEMO=true;initWalkers();showStart();}
  requestAnimationFrame(frame);
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>(DEMO||scene==='battle')?{}:{S});}catch(e){}
(window.claude&&window.claude.hot&&window.claude.hot.ready)?window.claude.hot.ready(boot):boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
